components:
  schemas:
    ContextRequirementDto:
      type: object
      properties:
        scope:
          type: string
        required:
          type: array
          items:
            type: string
        optional:
          type: array
          items:
            type: string
      required:
      - optional
      - required
      - scope
    CreatePromptRequestDto:
      type: object
      properties:
        key:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        category:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        semVer:
          type: string
          minLength: 1
        source:
          type: string
          minLength: 1
        variables:
          type: array
          items:
            $ref: "#/components/schemas/VariableDefinitionDto"
        contextRequirements:
          type: array
          items:
            $ref: "#/components/schemas/ContextRequirementDto"
        validation:
          $ref: "#/components/schemas/ValidationSettingsDto"
        output:
          $ref: "#/components/schemas/OutputDeclarationDto"
      required:
      - contextRequirements
      - key
      - name
      - semVer
      - source
      - tags
      - variables
    OutputDeclarationDto:
      type: object
      properties:
        format:
          type: string
        schemaRef:
          type: string
      required:
      - format
    ValidationSettingsDto:
      type: object
      properties:
        maxLength:
          type: integer
          format: int32
        maxTokens:
          type: integer
          format: int32
        policies:
          type: array
          items:
            type: string
        placeholders:
          type: string
      required:
      - placeholders
      - policies
    VariableDefinitionDto:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        source:
          type: string
        required:
          type: boolean
        default:
          type: object
        constraints:
          type: array
          items:
            type: string
        sensitive:
          type: boolean
      required:
      - constraints
      - name
      - required
      - sensitive
      - source
      - type
    KeySemVerResponseDto:
      type: object
      properties:
        key:
          type: string
        semVer:
          type: string
      required:
      - key
      - semVer
    CreateVersionRequestDto:
      type: object
      properties:
        semVer:
          type: string
          minLength: 1
        source:
          type: string
          minLength: 1
        variables:
          type: array
          items:
            $ref: "#/components/schemas/VariableDefinitionDto"
        contextRequirements:
          type: array
          items:
            $ref: "#/components/schemas/ContextRequirementDto"
        validation:
          $ref: "#/components/schemas/ValidationSettingsDto"
        output:
          $ref: "#/components/schemas/OutputDeclarationDto"
      required:
      - contextRequirements
      - semVer
      - source
      - variables
    RejectRequestDto:
      type: object
      properties:
        comment:
          type: string
          minLength: 1
      required:
      - comment
    DeprecateRequestDto:
      type: object
      properties:
        recommendedReplacement:
          type: string
    ApproveRequestDto:
      type: object
