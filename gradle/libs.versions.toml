[versions]
kotlin = "2.4.10"
spring-boot = "3.4.1"
spring-dependency-management = "1.1.7"
ktlint-gradle = "12.1.2"
detekt = "1.23.8"
archunit = "1.5.0"
junit = "6.1.2"
kotest = "5.9.1"
mockk = "1.14.11"
testcontainers = "2.0.5"
flyway = "13.1.0"
snakeyaml = "2.6"
jackson = "2.18.2"
springdoc-openapi = "3.1.0"
kafka = "4.3.1"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

# Front Matter（YAML）解析用。任意クラスのインスタンス化を許すunsafeな既定Constructorではなく、
# SafeConstructor + 制限付きLoaderOptions（PromptDslParser側で設定）で使用する。
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }

spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-data-jdbc = { module = "org.springframework.boot:spring-boot-starter-data-jdbc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-openapi" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
# Redpanda（Kafkaワイヤプロトコル互換）。ADR-0006「Kafka互換Broker」・ADR-0025決定9で採用。
# testcontainers-bom管理下のため個別バージョン指定は不要（testcontainers-postgresqlと同じ方針）。
testcontainers-redpanda = { module = "org.testcontainers:redpanda" }

# OutboxRelayerのBroker送信・購読側冪等性テストfixtureで使うProducer/Consumer（ADR-0025）。
# Redpandaはこのクライアントとワイヤプロトコルレベルで通信できる。
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }

flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

# postgresql / jackson-module-kotlin はバージョン未指定。infrastructure配下で
# Gradleネイティブの platform("org.springframework.boot:spring-boot-dependencies:...")
# によりspring-boot-dependencies BOMをimportし、そのBOM管理下のバージョンで解決する
# （spring-boot-starter-* と同じ方針）。io.spring.dependency-managementは、detekt等の
# 無関係なConfigurationまでBOM制約下に置いてしまうため使わない（EventStorePromptRepository
# 実装時のコミット参照）。
postgresql = { module = "org.postgresql:postgresql" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

# plugins/formatter-json用。Spring BOM管理下ではない単体プロジェクトのため、
# snakeyamlと同じ方針でバージョンを明示指定する（ADR-0014）。
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

# 注意: 以下の [plugins] エントリはドキュメント目的で定義しているが、モジュールの build.gradle.kts から
# alias(libs.plugins.*) では参照しない。buildSrc（kotlin-dsl）が Kotlin Gradle Plugin を暗黙提供しており、
# 同一プラグインIDを明示versionで再解決しようとすると衝突するため、実際の適用は buildSrc の規約プラグイン
# （promptengine.kotlin-conventions / promptengine.spring-boot-conventions）内で行い、
# バージョンは buildSrc/build.gradle.kts 側で手動管理している。ここでは参照用の一覧として保持する。
[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
