spring:
  application:
    name: prompt-engine
  datasource:
    url: ${PE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/prompt_engine}
    username: ${PE_DATASOURCE_USERNAME:prompt_engine}
    password: ${PE_DATASOURCE_PASSWORD:prompt_engine}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        # prometheus: §2.15 Metrics（ADR-0027決定2）。Push型エクスポータ設定不要で
        # /actuator/prometheus をPrometheus側がスクレイプする。
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # Kubernetes環境では既定で自動有効化されるが（KUBERNETES_SERVICE_HOST検出）、
        # ローカル/Docker単体実行時にも/actuator/health/{liveness,readiness}を
        # 一貫して使えるよう明示的に有効化する（P11、SecurityConfigのpermitAllと対）。
        enabled: true

pe:
  # CIAP（設計書§1）が発行するJWTのJWKSエンドポイント。未設定時はローカル開発用に
  # 起動時生成するRSA鍵ペアで自己署名検証する（CiapSecurityConfig参照。実運用では必須設定）。
  ciap:
    jwks-uri: ${PE_CIAP_JWKS_URI:}
  validation:
    banned-words: ${PE_VALIDATION_BANNED_WORDS:}

promptengine:
  # 背景中継ジョブ（Outbox Relay/Broker購読）の起動可否（P11、Helm `api`/`worker`/`admin`
  # Deploymentの分離用）。`false`にするとOutboxRelayConfig/SubscriberConfig自体が
  # 丸ごと無効化される（productionプロファイルとの組み合わせでのみ意味を持つ）。
  scheduler:
    enabled: ${PE_SCHEDULER_ENABLED:true}
  eventbus:
    # Outbox → Broker中継のポーリング設定（productionプロファイルのみ有効、ADR-0025決定5）。
    relay:
      poll-interval-ms: ${PE_EVENTBUS_RELAY_POLL_INTERVAL_MS:750}
      batch-size: ${PE_EVENTBUS_RELAY_BATCH_SIZE:50}
      claim-timeout-seconds: ${PE_EVENTBUS_RELAY_CLAIM_TIMEOUT_SECONDS:30}
    # Broker購読側のポーリング設定（productionプロファイルのみ有効、ADR-0026決定1）。
    subscriber:
      poll-interval-ms: ${PE_EVENTBUS_SUBSCRIBER_POLL_INTERVAL_MS:500}
      poll-timeout-ms: ${PE_EVENTBUS_SUBSCRIBER_POLL_TIMEOUT_MS:500}
      max-poll-records: ${PE_EVENTBUS_SUBSCRIBER_MAX_POLL_RECORDS:100}
    kafka:
      bootstrap-servers: ${PE_EVENTBUS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  # archiveガード（Issue #48、ADR-0026決定5）。
  # execution-logs-cutover-at 以前に作られたPromptVersionは、実行記録の不在から参照ゼロを
  # 結論できないため判断不能として扱い、従来通り force=true を必須にする。
  archive:
    execution-logs-cutover-at: ${PE_ARCHIVE_EXECUTION_LOGS_CUTOVER_AT:2026-08-09T00:00:00Z}
    inactivity-threshold-days: ${PE_ARCHIVE_INACTIVITY_THRESHOLD_DAYS:90}
  # executeLongRunning予約のクレームタイムアウト（Issue #50、ADR-0027）。
  idempotency:
    claim-timeout-seconds: ${PE_IDEMPOTENCY_CLAIM_TIMEOUT_SECONDS:120}
  # OTLPエクスポータの送信先（Issue #38、ADR-0027決定2）。未設定ならSpanは生成されるが
  # エクスポートされない（ローカル・CIでの安全な既定挙動、OtelTracerConfig参照）。
  observability:
    otel:
      exporter-endpoint: ${PE_OTEL_EXPORTER_ENDPOINT:}
  # 実行アダプタの選択（ADR-0030決定4、ADR-0031）。既定fakeはM1からの挙動を変えない。
  # apapは将来のAPAP接続用の値（APAPは独立基盤として別途構築する方針、実装は未着手）。
  execution:
    provider: ${PE_EXECUTION_PROVIDER:fake}
  # ModelProfileの供給元（M2-1c、ADR-0030決定1）。APAP不在のためconfigとして保持し、
  # 価格改定・モデル追加のたびに値を変更してデプロイし直す運用とする。
  model-profile:
    max-context-tokens: ${PE_MODEL_PROFILE_MAX_CONTEXT_TOKENS:8000}
    tokenizer-id: ${PE_MODEL_PROFILE_TOKENIZER_ID:approx}
    cost-per-token: ${PE_MODEL_PROFILE_COST_PER_TOKEN:0.000001}
  # ReviewCaseの承認ポリシー（ADR-0032決定2/3）。required-approvalsはsubmitForReview時点で
  # ReviewCaseへ複製されるため、変更しても進行中のReviewCaseには遡及しない。
  # allow-self-approvalは複製されず、approveのたびに現在値を読む。既定falseは4-eyes強制。
  review:
    required-approvals: ${PE_REVIEW_REQUIRED_APPROVALS:1}
    allow-self-approval: ${PE_REVIEW_ALLOW_SELF_APPROVAL:false}
  # PromptCache（Issue #77、ADR-0033）。ttl-seconds既定30秒はOutboxRelayの
  # claim-timeout-secondsの既定値と揃えたもの（イベント無効化が届く前に読まれる窓の上限）。
  cache:
    ttl-seconds: ${PE_CACHE_TTL_SECONDS:30}
    redis-uri: ${PE_CACHE_REDIS_URI:redis://localhost:6379}
  # Benchmark実行ワーカーのポーリング設定（productionプロファイルのみ有効、ADR-0035決定3）。
  # poll-interval-msはOutboxRelayより長め（項目1件の実行が数秒〜数十秒かかるため）。
  benchmark:
    worker:
      poll-interval-ms: ${PE_BENCHMARK_WORKER_POLL_INTERVAL_MS:2000}
      batch-size: ${PE_BENCHMARK_WORKER_BATCH_SIZE:20}
      claim-timeout-seconds: ${PE_BENCHMARK_WORKER_CLAIM_TIMEOUT_SECONDS:60}
      execution-timeout-ms: ${PE_BENCHMARK_WORKER_EXECUTION_TIMEOUT_MS:30000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
