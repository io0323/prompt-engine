apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prompt-engine.fullname" . }}-worker
  labels:
    {{- include "prompt-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "prompt-engine.labels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "prompt-engine.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        {{- include "prompt-engine.container" (dict "root" . "schedulerEnabled" true) | nindent 8 }}
      {{- include "prompt-engine.volumes" . | nindent 6 }}
