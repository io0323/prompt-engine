{{- if .Values.secret.create }}
# ローカル検証専用（values.yaml `secret.create`のKDoc参照）。本番は create: false にし、
# Secret Manager等から供給した既存Secret（Values.secret.name）を参照すること。
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "prompt-engine.labels" . | nindent 4 }}
type: Opaque
stringData:
  datasource-username: {{ .Values.secret.datasourceUsername | quote }}
  datasource-password: {{ .Values.secret.datasourcePassword | quote }}
  execution-api-key: {{ .Values.secret.executionApiKey | quote }}
{{- end }}
