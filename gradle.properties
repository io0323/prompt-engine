# Maven Central 等リポジトリからの依存解決が一時的に失敗した場合のリトライ設定。
# CIでのネットワーク起因の一時的な403/接続断でビルドが落ちる問題への耐性を高める。
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=500

# Gradle 9.6.1（8.11.1からのメジャー更新、gradle-wrapper.properties参照）でJVMヒープの
# 既定推定値が変わり、CodeQL autobuild環境（GitHub Actions標準runner上でCodeQLトレーサーと
# 同時実行、Gradleの自動検出よりメモリ余裕が少ない）でKotlinコンパイルタスクが
# OutOfMemoryError（GC overhead limit exceeded）で失敗するようになった。ヒープ上限を
# 明示することで、Gradle自身の自動検出（実行環境の総メモリに基づく）に依存しない
# 決定的なメモリ使用量にする。
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx2048m
