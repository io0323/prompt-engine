version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Spring Boot 4.x（Spring Framework 7ベース）はKotlinコンパイラが2.0.21に固定されている
      # 現状（detekt-gradle-plugin 1.23.8がKotlin 2.0.21を要求、安定版でKotlin 2.1+をサポートする
      # リリースは未提供）では、FirIncompatibleClassExpressionCheckerのコンパイラ内部クラッシュで
      # ビルド不能（PR #58で確認・クローズ）。detektが安定版でKotlin 2.1+をサポートするまで
      # メジャーバージョン更新を保留する。マイナー/パッチ更新は通常通り提案してよい。
      - dependency-name: "org.springframework.boot"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
