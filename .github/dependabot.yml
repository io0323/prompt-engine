version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Spring Boot 4.x（Spring Framework 7ベース）は、実際に適用されるKotlinコンパイラの
      # バージョンではビルド不能（PR #58で確認・クローズ）。
      #
      # 実際に適用されるKotlinコンパイラのバージョンは、buildSrc/build.gradle.ktsが手動固定する
      # kotlin-gradle-plugin/kotlin-allopen（2.0.21、detekt-gradle-plugin 1.23.8が要求する値、
      # 安定版でKotlin 2.1+をサポートするdetektリリースは未提供）である。gradle/libs.versions.toml
      # の`kotlin = "2.4.10"`は[plugins]ブロックの参照用の値にすぎず（同ファイルのコメント参照）、
      # 実際のプラグイン適用には使われない。Spring Boot 4.1.0のBOMが引き込む依存の中に、この
      # 2.0.21コンパイラが解釈できないメタデータでビルドされたものが含まれており、
      # FirIncompatibleClassExpressionCheckerのコンパイラ内部クラッシュ（source must not be null）
      # を引き起こす。detektが安定版でKotlin 2.1+をサポートするまでメジャーバージョン更新を保留する。
      # マイナー/パッチ更新は通常通り提案してよい。
      #
      # dependency-nameはワイルドカードにする: ルートcatalogの[plugins]プラグインマーカー
      # （org.springframework.boot）と、buildSrc/build.gradle.ktsが個別に固定する
      # spring-boot-gradle-plugin（groupId:artifactId座標）の両方をカバーするため
      # （Dependabotが検出名称をどちらの形式で報告してもマッチさせる、CodeRabbitレビュー指摘）。
      #
      # 根本原因の解消（detektのKotlin 2.0.21固定を外す）はIssue #104で追跡する。
      - dependency-name: "org.springframework.boot*"
        update-types: ["version-update:semver-major"]

      # kotlin-gradle-plugin/kotlin-allopenは、上記と同じdetekt-gradle-plugin 1.23.8の制約で
      # buildSrc/build.gradle.ktsが2.0.21に手動固定している（本ファイル上部のコメント参照）。
      # 2.0.21から2.4.10へのマイナー更新でも detekt was compiled with Kotlin 2.0.21 but is
      # currently running with 2.4.10 で即座に失敗することをローカルで確認済み（PR #64で確認・
      # クローズ）。semver-major/minor/patchのどのレベルの更新でも同様に壊れるため、
      # update-typesで絞らずこの2依存の更新自体を丸ごと保留する。
      #
      # 根本原因の解消（detektのKotlin 2.0.21固定を外す）はIssue #104で追跡する。
      - dependency-name: "org.jetbrains.kotlin:kotlin-gradle-plugin"
      - dependency-name: "org.jetbrains.kotlin:kotlin-allopen"

      # springdoc-openapi 3.x系はSpring Boot 4.1.0（Spring Framework 7ベース）を要求する
      # （3.1.0のリリースノート「Upgrade Spring Boot to version 4.1.0」に明記）。
      # このリポジトリはSpring Boot 3.x系に固定しているため（CLAUDE.md技術スタック）、
      # springdocを3.x系へ上げると上記と全く同じ原因（実際に適用されるKotlinコンパイラ
      # 2.0.21が、Spring Boot 4系のBOMが引き込む依存のKotlinメタデータ（2.2.0/2.3.0）を
      # 読めない）でprompt-engine-interfaceのcompileKotlinが失敗する（PR #97で確認・
      # クローズ）。Spring Boot 3.x系のままとどまる限り、springdocのメジャー更新を
      # 安全に取り込むことはできない。
      #
      # 根本原因（detektのKotlin 2.0.21固定）の解消はIssue #104、springdoc 3.x /
      # Spring Boot 4.x移行そのものの検討はIssue #105で追跡する。
      #
      # マイナー更新（2.8.6→2.9.0、PR #108）も別の理由で保留する: 2.9.0で
      # springdoc/swagger-coreのnullableフィールドのスキーマ表現がOpenAPI 3.1スタイル
      # （`type: [X, "null"]`・`oneOf: [$ref, {type: "null"}]`）へ変わり、これが
      # contract.ymlのoasdiff breaking-change検出（fail-on: ERR）に29件抵触することを
      # ローカルで`generateOpenApiDocs`を実際に再実行して確認した（PR #108で確認・
      # クローズ）。単なる再生成では直らない。さらに`VariableDefinitionDto.default`
      # （`CommonDtos.kt`、Kotlinの`Any? = null`）のスキーマが`type: object`（2.8.6、
      # 緩いが「任意の値」であることは伝わる）から`type: "null"`のみ（2.9.0、nullしか
      # 受け付けないように見える誤ったドキュメントになる）へ後退する実質的な劣化も
      # 見つかっている。`default`等の裸の`Any?`フィールドに明示的な`@Schema`注釈で
      # スキーマを固定するか、springdocの後続リリースでこの退行が直るまで見直さない。
      - dependency-name: "org.springdoc:springdoc-openapi-starter-webmvc-ui"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

      # kotest（kotest-runner-junit5 / kotest-assertions-core、gradle/libs.versions.tomlの
      # kotest = "5.9.1"を共有参照）の5.9.1→6.2.4更新は、上記と同じdetekt-gradle-plugin 1.23.8
      # によるKotlin 2.0.21固定が原因でビルドできない。6.2.4はより新しいKotlinでコンパイルされて
      # おり、tests:integration:compileIntegrationTestKotlinがFirIncompatibleClassExpression
      # Checker系のコンパイラ内部クラッシュ（IllegalArgumentException: source must not be null）
      # で失敗することを確認済み（PR #100で確認・クローズ）。detekt 1.23.8によるKotlin 2.0.21
      # 固定が原因。Issue #104の解消後に見直すこと。
      #
      # dependency-nameはワイルドカードにする: kotest-runner-junit5とkotest-assertions-coreの
      # 両方をカバーするため（org.springframework.boot*と同じ理由）。
      - dependency-name: "io.kotest:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
