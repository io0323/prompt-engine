name: CodeQL
on:
  pull_request:
  push: { branches: [main] }
  schedule:
    - cron: '0 3 * * 1'
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      matrix:
        language: ['java-kotlin']
    steps:
      - uses: actions/checkout@v7
      - name: Check for Gradle build files
        id: gradle_check
        run: echo "exists=$( [ -f ./gradlew ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/init@v4.37.3
        if: steps.gradle_check.outputs.exists == 'true'
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4.37.3
        if: steps.gradle_check.outputs.exists == 'true'
      - uses: github/codeql-action/analyze@v4.37.3
        if: steps.gradle_check.outputs.exists == 'true'
        with:
          category: '/language:${{ matrix.language }}'
      - name: Skip (Gradle not yet initialized — P0 pending)
        if: steps.gradle_check.outputs.exists == 'false'
        run: echo "::notice::./gradlew not found. Skipping CodeQL analysis until P0 (repository init) is complete."
