name: Release
on:
  push:
    tags: ['v*']

# 実装ガイド§3.4: `v*`タグでコンテナイメージをGHCRへpush、`prompt-engine-plugin-api`を
# Maven publish（GitHub Packages）する。GITHUB_TOKENのみで完結し、追加シークレットは不要。
permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          image="ghcr.io/${{ github.repository_owner }}/prompt-engine"
          image="${image,,}"
          docker build -f deploy/docker/Dockerfile \
            -t "$image:${{ steps.version.outputs.version }}" \
            -t "$image:latest" .
          docker push "$image:${{ steps.version.outputs.version }}"
          docker push "$image:latest"

  publish-plugin-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Publish prompt-engine-plugin-api to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./gradlew :modules:prompt-engine-plugin-api:publish \
            -Pversion=${{ steps.version.outputs.version }} --no-daemon
