# このジョブが検証するのは「実装(springdoc生成物)とapi/openapi.yamlの一致」および
# PRのベースブランチとの破壊的変更の有無（PRイベントのみ）で、契約自体の正しさ
# （クエリパラメータの表現等）は検証しない（CONTRIBUTING.md参照）。
# 契約内容の正しさはtests/contractのアサーションで担保する。
name: contract
on:
  pull_request:
  push: { branches: [main] }
concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prompt_engine
          POSTGRES_USER: prompt_engine
          POSTGRES_PASSWORD: prompt_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prompt_engine -d prompt_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Check for Gradle wrapper
        id: gradlew
        run: echo "exists=$( [ -f ./gradlew ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      # `application.yml`のdatasourceデフォルト（localhost:5432, prompt_engine/prompt_engine/prompt_engine）が
      # 上のpostgresサービスコンテナの設定と一致するため、env override不要でそのまま起動できる。
      - name: springdocからapi-docsを再生成しapi/openapi.yamlとの差分を検証
        if: steps.gradlew.outputs.exists == 'true'
        run: |
          ./gradlew :modules:prompt-engine-bootstrap:generateOpenApiDocs --no-daemon
          # `git diff --exit-code`だけだと未追跡ファイルの削除を見逃す（PRがコミット済みの
          # api/openapi.yamlを削除しても、generateOpenApiDocsが作業ツリーへ再生成した
          # 未追跡ファイルとdiffが無いためgreenになってしまう、CodeRabbitレビュー指摘）。
          # `git ls-files --error-unmatch`でコミットに実在することも別途確認する。
          if ! git diff --exit-code -- api/openapi.yaml ||
             ! git ls-files --error-unmatch -- api/openapi.yaml > /dev/null 2>&1; then
            echo "::error::api/openapi.yaml is out of date or not committed. Run './gradlew :modules:prompt-engine-bootstrap:generateOpenApiDocs' and commit the result."
            exit 1
          fi
      - name: 契約テスト (tests/contract)
        if: steps.gradlew.outputs.exists == 'true'
        run: ./gradlew :tests:contract:test --no-daemon
      - name: Fetch base branch for breaking-change comparison
        if: steps.gradlew.outputs.exists == 'true' && github.event_name == 'pull_request'
        id: fetch-base
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          # base側にapi/openapi.yamlがまだ存在しない場合（このファイルを初めて導入するPR）は
          # 比較対象が無いためoasdiffをスキップする。
          if git show "origin/${{ github.base_ref }}:api/openapi.yaml" > /dev/null 2>&1; then
            echo "has_base=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_base=false" >> "$GITHUB_OUTPUT"
            echo "::notice::api/openapi.yaml does not exist on ${{ github.base_ref }} yet; skipping breaking-change check."
          fi
      # 破壊的変更のみ失敗させる（fail-on: ERR）。フィールド追加等の非破壊的変更で
      # 誤ってPRをブロックしないため（M1時点でAPIサーフェス自体が発展途上のため）。
      - name: 破壊的変更検出 (oasdiff)
        if: steps.gradlew.outputs.exists == 'true' && github.event_name == 'pull_request' && steps.fetch-base.outputs.has_base == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: 'origin/${{ github.base_ref }}:api/openapi.yaml'
          revision: 'HEAD:api/openapi.yaml'
          fail-on: ERR
          github-token: ${{ github.token }}
      # `contract`はrequired status check（ブランチ保護）であるため、他ジョブ（ci.ymlのbuild/lint/
      # arch-test/test）と違い「gradlewが無ければ黙って成功」は許容しない（CodeRabbitレビュー
      # 指摘: PRが./gradlewを削除すると、契約検証を何も実行せずgreenになってしまう）。
      - name: Fail when Gradle wrapper is missing
        if: steps.gradlew.outputs.exists == 'false'
        run: |
          echo "::error::./gradlew is required for contract validation."
          exit 1
      - uses: actions/upload-artifact@v7
        if: always() && steps.gradlew.outputs.exists == 'true'
        with: { name: contract-reports, path: '**/build/reports/**' }
