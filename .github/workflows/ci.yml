name: CI
on:
  pull_request:
  push: { branches: [main] }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Check for Gradle wrapper
        id: gradlew
        run: echo "exists=$( [ -f ./gradlew ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.gradlew.outputs.exists == 'true'
        run: ./gradlew assemble --no-daemon
      - name: Skip (Gradle not yet initialized — P0 pending)
        if: steps.gradlew.outputs.exists == 'false'
        run: echo "::notice::./gradlew not found. Skipping until P0 (repository init) is complete."
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Check for Gradle wrapper
        id: gradlew
        run: echo "exists=$( [ -f ./gradlew ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - name: Lint
        if: steps.gradlew.outputs.exists == 'true'
        run: ./gradlew ktlintCheck detekt --no-daemon
      - name: Skip (Gradle not yet initialized — P0 pending)
        if: steps.gradlew.outputs.exists == 'false'
        run: echo "::notice::./gradlew not found. Skipping until P0 (repository init) is complete."
  arch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Check for Gradle wrapper
        id: gradlew
        run: echo "exists=$( [ -f ./gradlew ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - name: Clean Architecture制約検証
        if: steps.gradlew.outputs.exists == 'true'
        run: ./gradlew :modules:prompt-engine-bootstrap:test --tests '*ArchitectureTest' --no-daemon
      - name: Skip (Gradle not yet initialized — P0 pending)
        if: steps.gradlew.outputs.exists == 'false'
        run: echo "::notice::./gradlew not found. Skipping until P0 (repository init) is complete."
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Check for Gradle wrapper
        id: gradlew
        run: echo "exists=$( [ -f ./gradlew ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - name: Determine available test tasks
        id: tasks
        if: steps.gradlew.outputs.exists == 'true'
        run: |
          has_task() { ./gradlew help --task "$1" > /dev/null 2>&1; }
          echo "integration_test=$(has_task integrationTest && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "jacoco_verify=$(has_task jacocoTestCoverageVerification && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Unit + Integration (Testcontainers)
        if: steps.gradlew.outputs.exists == 'true'
        # integrationTest（P2〜）/ jacocoTestCoverageVerification（未導入）は
        # タスクが存在する場合のみ実行に加える。
        # :tests:integration:verifyIntegrationTestExecuted は、integrationTestが
        # SourceSet配線の破損等でNO-SOURCEのままsilent greenになっていないかを検証する
        # 独立したタスクであり、上記の動的検出に関わらず必ず呼ぶ（検出ロジック自体が
        # 壊れているケースも見逃さないため）。
        run: |
          tasks="test :tests:integration:verifyIntegrationTestExecuted"
          [ "${{ steps.tasks.outputs.integration_test }}" = "true" ] && tasks="$tasks integrationTest"
          [ "${{ steps.tasks.outputs.jacoco_verify }}" = "true" ] && tasks="$tasks jacocoTestCoverageVerification"
          # 集約カバレッジゲート（P10b、ADR-0026決定8）。prompt-engine-infrastructureの
          # 主要部分はtests/integrationで検証しており、既定のjacocoTestCoverageVerification
          # （自プロジェクトのtestのexecのみ）には現れない。統合テストのexecを合算した
          # 集約レポートに対する下限検証はここでのみ実行する（`./gradlew build`だけで
          # Dockerが必要になるのを避けるため、checkには配線していない）。
          tasks="$tasks :modules:prompt-engine-infrastructure:jacocoAggregatedCoverageVerification"
          ./gradlew $tasks --no-daemon
      - name: Skip (Gradle not yet initialized — P0 pending)
        if: steps.gradlew.outputs.exists == 'false'
        run: echo "::notice::./gradlew not found. Skipping until P0 (repository init) is complete."
      - name: 実プロバイダAPI疎通確認テストのスキップ状況を通知
        # PE_OPENAI_API_KEY未設定時はJUnit5がOpenAiExecutionAdapterRealApiTestをskip扱いにする
        # （M2-1c、ADR-0030決定3）。tag除外と違いJUnit XMLに`skipped="1"`として残るため、
        # ここで検出してChecksタブに明示する（「実行されなかった」事実がログに埋もれるsilent
        # greenを防ぐ）。CIではこのキーを意図的に設定しない（実プロバイダへの課金・外部要因の
        # 不安定性を必須ゲートに持ち込まない方針）ため、このnoticeは常時出る想定。
        if: always() && steps.gradlew.outputs.exists == 'true'
        run: |
          xml="plugins/execution-openai/build/test-results/test/TEST-promptengine.plugin.execution.openai.OpenAiExecutionAdapterRealApiTest.xml"
          if [ -f "$xml" ] && grep -q 'skipped="1"' "$xml"; then
            echo "::notice::実プロバイダAPI疎通確認テスト（OpenAiExecutionAdapterRealApiTest）はスキップされました（PE_OPENAI_API_KEY未設定、意図された挙動）。実測はユーザーが手元で実行する運用です（tools/perf/README.md参照）。"
          fi
      - uses: actions/upload-artifact@v7
        if: always() && steps.gradlew.outputs.exists == 'true'
        with:
          name: test-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
