name: Bug Report
description: 不具合を報告する
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 問題を再現するための具体的な手順
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の挙動
    validations:
      required: true
  - type: input
    id: trace-id
    attributes:
      label: traceId
      description: 該当するリクエストの traceId（分かる場合）
      placeholder: 例 4bf92f3577b34da6a3ce929d0e0e4736
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: バージョン、実行環境など
    validations:
      required: false
