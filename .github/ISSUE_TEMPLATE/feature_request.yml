name: Feature Request
description: 新機能・仕様変更を提案する
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: input
    id: design-doc-section
    attributes:
      label: 対応する設計書の節番号
      description: 本提案が関連する docs/PromptEngine_設計書.md の節番号。該当節がない場合はADR起票を検討してください。
      placeholder: 例 §2.11 Optimization仕様
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 背景・目的
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
    validations:
      required: false
